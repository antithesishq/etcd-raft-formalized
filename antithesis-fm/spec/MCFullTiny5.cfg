SPECIFICATION FullSpec
CONSTANTS
  Server = {s1, s2, s3}
  InitVoters = {s1, s2, s3}
  Values = {v1}
  Nil = Nil
  MaxTerm = 2
  MaxLog = 2
  MaxBatch = 1
  MaxMsgs = 5
  ConfChanges <- NoChanges
CONSTRAINT Bounded
SYMMETRY Symmetry
INVARIANTS
  ElectionSafety
  OneVotePerTerm
  LogMatching
  CommitSafety
  StateMachineSafety
  LeaderCompleteness
  CommittedEntriesPreserved
  LeaderLogIsLed
  RequestsFromLed
  ConfirmedWithinLog
PROPERTIES
  TermMonotonic
  CommitMonotonic
  NoAppliesSkipped
CHECK_DEADLOCK FALSE
