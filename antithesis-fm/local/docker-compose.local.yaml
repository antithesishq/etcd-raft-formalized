# Overlay for local runs (scripts/local-run.sh): SDK output to a file; the
# driver's eventually check is off unless DRIVER_EVENTUALLY=on
# (DRIVER_EVENTUALLY_AFTER=seconds).
services:
  driver:
    environment:
      ANTITHESIS_SDK_LOCAL_OUTPUT: /tmp/sdk.jsonl
      DRIVER_EVENTUALLY: ${DRIVER_EVENTUALLY:-off}
      DRIVER_EVENTUALLY_AFTER: ${DRIVER_EVENTUALLY_AFTER:-}
      DRIVER_ADD_RATE: ${DRIVER_ADD_RATE:-5}
      DRIVER_LINEAR_RATE: ${DRIVER_LINEAR_RATE:-2}
